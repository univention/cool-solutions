---
# Installs univention-usercert + univention-windowscert (which pulls in
# univention-ldap-usercert as a hard dependency) from the MR's Aptly
# repository. Runs after configure_aptly_usercert has wired up the repo
# server via TDP's provide_aptly_sources.yml.
#
# Both packages' postinst call their own join script automatically
# (31univention-usercert.inst / 32univention-windowscert.inst -- register
# the pki UDM extended attributes + hooks) -- no separate
# univention-run-join-scripts call needed on an already-joined domain.
#
# No license import: every pre-joined template in the Images pool is fixed
# at ldap/base dc=ucs,dc=test, not dc=ucs,dc=example -- see the same note in
# playbook-sudo_ldap.yml / playbook-moodle.yml.

- name: Install univention-usercert and univention-windowscert
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Enable the cool-solutions customer-scope repository component
      ansible.builtin.command:
        cmd: >-
          univention-config-registry set
          repository/online/component/cool-solutions=yes
          repository/online/component/cool-solutions/version=current
          repository/online/component/cool-solutions/unmaintained=yes
      changed_when: true

    - name: Install univention-usercert and univention-windowscert
      ansible.builtin.command:
        cmd: univention-install --yes univention-usercert univention-windowscert
      changed_when: true
