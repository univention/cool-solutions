[Global]
# These settings can be overwritten by the instance
logfile: autotest.log

proxmox_node: uni-pve-03
proxmox_template_pool: Images
proxmox_pool: PS
proxmox_bridge: PS
proxmox_extra_label: [ENV:JOB_BASE_NAME]
proxmox_vcpus: 2
proxmox_memory: 4096

environment:
 UCS_VERSION=[ENV:UCS_VERSION]

[pdn]
proxmox_template: template-ucs-joined-5.2-6-primary
command1:
 LOCAL echo "[pdn]" >> "inventory.ini"
 LOCAL echo "pdn ansible_host=[pdn_IP]" >> "inventory.ini"
 PUT /setup/ssh_ansible_key.pub /root/.ssh/authorized_keys
 chmod 600 /root/.ssh/authorized_keys
 . utils.sh; basic_setup
 ucr set nameserver1=10.208.1.15 nameserver2=10.208.1.16 dns/forwarder1=10.208.1.15 dns/forwarder2=10.208.1.16
 systemctl restart named || true
 # template is pre-joined -- no-op on the primary, kept for uniformity
 . utils.sh; basic_setup_ucs_joined "[pdn_IP]"
 . utils.sh; rotate_logfiles
 . utils.sh; add_tech_key_authorized_keys
 . utils.sh; upgrade_to_latest_errata
command2:
 # no join step: template-ucs-joined-5.2-6-primary is already a fully provisioned domain
files:
 _test-environment/utils/utils.sh /root/

[win1]
windows: true
proxmox_template: template-win2k22-server
ad_domain_admin_name: Administrator
ad_domain_admin_password: Univention.99
command1:
 # Windows guest: no SSH, managed entirely via WinRM from the Ansible playbook. Placed in
 # a "windows" inventory group (not just its own [win1] group) so TDP's own reachability
 # check -- which pings "all:!windows" with the SSH-only ping module -- knows to skip it
 # (see jobs-library.yml's ensure_host_availability helper, TDP hotfix MR !61).
 # ad_domain_admin_password above matches the win2k22 template's baked-in local
 # Administrator password (see .claude/skills/tdp-migrate/SKILL.md's Windows admin
 # credentials note) -- also used here as the ansible_password for WinRM auth.
 # Confirmed live via nmap: only port 5985 (WinRM HTTP) is open; 5986 (HTTPS) is
 # filtered -- this template's WinRM listener is HTTP-only (matches ucs-ec2-tools'
 # own EC2 Windows user-data script, which explicitly enables Basic/NTLM auth over
 # unencrypted HTTP rather than configuring a TLS listener).
 LOCAL echo "[win1]" >> "inventory.ini"
 LOCAL echo "win1 ansible_host=[win1_IP] ansible_connection=winrm ansible_port=5985 ansible_winrm_scheme=http ansible_winrm_transport=ntlm ansible_user=Administrator ansible_password=Univention.99" >> "inventory.ini"
 LOCAL echo "[windows]" >> "inventory.ini"
 LOCAL echo "win1" >> "inventory.ini"
