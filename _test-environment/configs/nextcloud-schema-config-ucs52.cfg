[Global]
# These settings can be overwritten by the instance
logfile: autotest.log

proxmox_node: uni-pve-03
proxmox_template_pool: Images
proxmox_pool: PS
proxmox_bridge: PS
proxmox_extra_label: [ENV:JOB_BASE_NAME]
proxmox_vcpus: 2
proxmox_memory: 4096

environment:
 UCS_VERSION=[ENV:UCS_VERSION]

# pdn-nextcloud-host and pdn-schema are two INDEPENDENT domains (each its own
# domaincontroller_master), not a primary/replica pair: pdn-nextcloud-host runs the
# actual Nextcloud app (App Center) and is configured to authenticate against
# pdn-schema's LDAP as an *external* directory -- this is exactly the "manual Nextcloud
# integration" scenario univention-nextcloud-schema's LDAP schema/extended-attributes
# exist for. Both sections get their own standalone pre-joined primary.

[pdn-nextcloud-host]
proxmox_template: template-ucs-joined-5.2-6-primary
# the template's stock disk (~5GB) isn't enough for the Nextcloud App Center Docker image --
# confirmed live ("no space left on device" mid-pull at 87% full before the image even finished
# downloading). Grow-only; requires the ucs-ec2-tools MR !88 pin already in this TDP_VERSION.
proxmox_disk_size: 30
command1:
 LOCAL echo "[pdn-nextcloud-host]" >> "inventory.ini"
 LOCAL echo "pdn-nextcloud-host ansible_host=[pdn-nextcloud-host_IP]" >> "inventory.ini"
 PUT /setup/ssh_ansible_key.pub /root/.ssh/authorized_keys
 chmod 600 /root/.ssh/authorized_keys
 . utils.sh; basic_setup
 ucr set nameserver1=10.208.1.15 nameserver2=10.208.1.16 dns/forwarder1=10.208.1.15 dns/forwarder2=10.208.1.16
 systemctl restart named || true
 # template is pre-joined -- no-op on the primary, kept for uniformity
 . utils.sh; basic_setup_ucs_joined "[pdn-nextcloud-host_IP]"
 . utils.sh; rotate_logfiles
 . utils.sh; add_tech_key_authorized_keys
 . utils.sh; upgrade_to_latest_errata
command2:
 # no join step: template-ucs-joined-5.2-6-primary is already a fully provisioned domain
files:
 _test-environment/utils/utils.sh /root/

[pdn-schema]
proxmox_template: template-ucs-joined-5.2-6-primary
command1:
 LOCAL echo "[pdn-schema]" >> "inventory.ini"
 LOCAL echo "pdn-schema ansible_host=[pdn-schema_IP]" >> "inventory.ini"
 PUT /setup/ssh_ansible_key.pub /root/.ssh/authorized_keys
 chmod 600 /root/.ssh/authorized_keys
 . utils.sh; basic_setup
 ucr set nameserver1=10.208.1.15 nameserver2=10.208.1.16 dns/forwarder1=10.208.1.15 dns/forwarder2=10.208.1.16
 systemctl restart named || true
 # template is pre-joined -- no-op on the primary, kept for uniformity
 . utils.sh; basic_setup_ucs_joined "[pdn-schema_IP]"
 . utils.sh; rotate_logfiles
 . utils.sh; add_tech_key_authorized_keys
 . utils.sh; upgrade_to_latest_errata
command2:
 # no join step: template-ucs-joined-5.2-6-primary is already a fully provisioned domain
files:
 _test-environment/utils/utils.sh /root/
